[package]
name = "csv_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chardetng = "1.0.0"
csv = "1.4.0"
encoding_rs = "0.8.42"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
gpui = "0.2.2"
memchr = "2.8.3"
memmap2 = "0.9.11"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
unicode-segmentation = "1.13.3"
url = "2.5.8"
